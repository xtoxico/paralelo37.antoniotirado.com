services:
  web:
    build: .
    container_name: paralelo37_presentacion
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paralelo37.entrypoints=websecure"
      - "traefik.http.routers.paralelo37.rule=Host(`paralelo37.antoniotirado.com`)"
      - "traefik.http.routers.paralelo37.tls=true"
      - "traefik.http.routers.paralelo37.tls.certresolver=letsencrypt"
      - "traefik.http.services.paralelo37.loadbalancer.server.port=80"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
